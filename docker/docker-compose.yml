version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ibude_user
      POSTGRES_PASSWORD: ibude_password
      POSTGRES_DB: ibude_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgres/data

volumes:
  - postres_data:
